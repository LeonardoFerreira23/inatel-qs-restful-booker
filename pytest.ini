[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

addopts =
    -v
    --strict-markers
    --html=reports/relatorio.html
    --self-contained-html

markers =
    smoke: testes rapidos de sanidade da API
    auth: cenarios de autenticacao e controle de acesso
    negativo: cenarios com dados invalidos ou inoportunos