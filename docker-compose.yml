services:
  jenkins:
    build: ./jenkins
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      REPO_BRANCH: ${REPO_BRANCH:-*/main}
      BOOKER_BASE_URL: http://restful-booker:3001
    volumes:
      - jenkins_home:/var/jenkins_home
      - relatorios:/var/relatorios
    depends_on:
      - restful-booker
      - mailpit

  restful-booker:
    image: mwinteringham/restfulbooker:latest
    platform: linux/amd64
    ports:
      - "3001:3001"

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

  relatorios:
    build: ./relatorios
    ports:
      - "8081:80"
    volumes:
      - relatorios:/usr/share/nginx/html:ro
    depends_on:
      - jenkins

volumes:
  jenkins_home:
  mailpit_data:
  relatorios:
